name: MATLAB Automated Tests

# Run this workflow every time code is pushed or a pull request is opened
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's code onto the GitHub server
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Request a free MATLAB environment from MathWorks
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            Reinforcement_Learning_Toolbox
            Deep_Learning_Toolbox
            Parallel_Computing_Toolbox

      # Step 3: Run all test scripts.
      # Delegated to .github/scripts/run_ci_suite.m, which is equivalent to the previous
      # inline runtests + assertSuccess but additionally republishes any failure as a
      # GitHub `::error::` annotation. Job logs require repository admin rights to read,
      # whereas annotations are public, so this is what makes a red run diagnosable from
      # a clone or a fork.
      - name: Run Unit Tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd, '.github', 'scripts')); run_ci_suite(pwd);
